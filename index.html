<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진밭골 예약 바로가기…</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center; }
  .card { padding: 2rem; text-align: center; max-width: 20rem; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(128,128,128,.3);
             border-top-color: #1a73e8; border-radius: 50%; margin: 0 auto 1rem;
             animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback { margin-top: 1rem; font-size: .9rem; opacity: .7; }
  a { color: inherit; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <p id="msg">진밭골 예약 페이지로 이동 중…</p>
  <p class="fallback">
    <a id="fallback-link" href="https://www.suseong.kr/camping/reservation/reservationState.do">
      자동 이동 실패 시 여기를 눌러 달력으로 가기
    </a>
  </p>
</div>
<form id="f" method="post" action="https://www.suseong.kr/camping/guide/reservationGuide.do">
  <input type="hidden" name="selectDate" id="selectDate">
  <input type="hidden" name="parmYear" id="parmYear">
  <input type="hidden" name="parmMonth" id="parmMonth">
</form>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var d = params.get('d'); // expected 'YYYY-MM-DD'
  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var m = d && d.match(DATE_RE);
  if (!m) {
    // 잘못된 파라미터: 그냥 달력 첫 화면으로
    location.replace('https://www.suseong.kr/camping/reservation/reservationState.do');
    return;
  }
  var year = m[1], month = m[2], selectDate = m[1] + '-' + m[2] + '-' + m[3];
  document.getElementById('selectDate').value = selectDate;
  document.getElementById('parmYear').value = year;
  // 원본 JS가 무패딩(nowMon 그대로)을 쓰므로 선행 0 제거해 호환 (서버가 둘 다 받지만 안전장치)
  document.getElementById('parmMonth').value = String(parseInt(month, 10));
  // fallback 링크도 해당 월 달력으로 갱신
  var fb = document.getElementById('fallback-link');
  fb.href = 'https://www.suseong.kr/camping/reservation/reservationState.do'
          + '?parmYear=' + year + '&parmMonth=' + month;
  // 자동 제출
  document.getElementById('f').submit();
})();
</script>
</body>
</html>
